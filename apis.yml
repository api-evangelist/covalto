name: Covalto
description: >-
  Covalto (formerly Credijusto) is a Mexican digital bank for small and
  medium-sized businesses, headquartered in Mexico City. It offers business and
  personal checking accounts, fixed-rate investment products, quick working-capital
  credit (Agil Covalto), factoring, leasing (arrendamiento), and fiduciary trust
  services (fideicomisos). Covalto acquired a regulated Mexican banking license,
  making it one of the first fintechs in Mexico to become a fully licensed bank.
  Its digital surface spans online banking, digital account opening, and a credit
  application flow. Covalto is backed by QED Investors. As of the latest review it
  publishes no public API developer portal; its developer documentation at
  docs.covalto.com is gated behind Google Identity-Aware Proxy for internal use.
